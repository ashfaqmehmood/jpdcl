name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=moderate
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run audit:launcher
      - run: bun run audit:http
      - run: node dist/launcher.js --help
      - run: bun pm pack --dry-run

  deploy-azure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ashfaqmehmood/jpdcl' && github.actor == 'ashfaqmehmood'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Build deployment bundle
        run: |
          bun install --frozen-lockfile
          bun run build
          mkdir bundle
          cp package.json bun.lock bundle/
          cd bundle
          bun install --production --frozen-lockfile
          cp -R ../dist ../deploy .
          curl --fail --location --silent --show-error \
            https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz \
            --output wireproxy.tar.gz
          echo 'e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  wireproxy.tar.gz' | sha256sum --check
          tar -xzf wireproxy.tar.gz wireproxy
          chmod 0755 wireproxy deploy/entrypoint.sh
          zip -qr jpdcl.zip dist node_modules deploy package.json wireproxy
      - uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy canonical main to Azure
        run: az webapp deploy --resource-group jpdcl --name jpdcl --type zip --src-path bundle/jpdcl.zip --clean true --restart true --track-status false --only-show-errors
      - name: Verify Azure health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error https://jpdcl.azurewebsites.net/health; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  publish-npm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ashfaqmehmood/jpdcl' && github.actor == 'ashfaqmehmood'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: jpdcl-npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish the next patch through npm trusted publishing
        run: |
          npm install --global npm@latest
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-smithery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ashfaqmehmood/jpdcl' && github.actor == 'ashfaqmehmood'
    needs: [verify, deploy-azure]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: jpdcl-smithery-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Refresh the canonical Smithery listing
        run: |
          echo "::add-mask::$SMITHERY_API_KEY"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SMITHERY_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"displayName":"JPDCL Smart Meter","description":"Unofficial read-only JPDCL account and smart-meter MCP with OAuth linking and 24 hosted tools.","homepage":"https://jpdcl.gododo.in","repositoryUrl":"https://github.com/ashfaqmehmood/jpdcl","license":"MIT","unlisted":false}' \
            'https://api.smithery.ai/servers/ass%2Fjpdcl'
          npx --yes smithery@latest mcp publish https://jpdcl.gododo.in/mcp --name ass/jpdcl
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
